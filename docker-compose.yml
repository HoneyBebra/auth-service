x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  auth:
    image: auth
    container_name: auth
    restart: always
    env_file:
      - .env
    build: .
    volumes:
      - ./migration/versions:/opt/app/migration/versions
    depends_on:
      postgres_auth:
        condition: service_healthy
      redis_auth:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8000/auth/api/v1/openapi.json'')" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  postgres_auth:
    image: postgres:17.4
    container_name: postgres_auth
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./infra/volumes/postgres_auth:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  redis_auth:
    image: redis:7.4.1
    container_name: redis_auth
    env_file:
      - .env
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - ./infra/volumes/redis:/data
      - ./infra/configs/redis:/usr/local/etc/redis
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD-SHELL", 'redis-cli -a ${REDIS_PASSWORD} ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  nginx_auth:
    container_name: nginx_auth
    image: nginx:1.25.5
    restart: always
    volumes:
      - ./infra/configs/nginx_auth/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/configs/nginx_auth/site.conf:/etc/nginx/conf.d/site.conf:ro
    ports:
      - "80:80"
    depends_on:
      auth:
        condition: service_healthy
    logging: *default-logging

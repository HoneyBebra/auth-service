server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;

    access_log /dev/stdout main;

    root /data;

    location = /auth/api/v1/users/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://auth:8000;
    }

    location = /auth/api/v1/users/signup {
        limit_req zone=signup_limit burst=3 nodelay;
        proxy_pass http://auth:8000;
    }

    location = /auth/api/v1/users/refresh {
        limit_req zone=refresh_limit burst=5 nodelay;
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://auth:8000;
    }

    location /auth/api/v1 {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://auth:8000;
    }

    error_page   404              /404.html;
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   html;
    }
}
